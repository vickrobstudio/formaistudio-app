workflows:
  ios-capacitor-workflow:
    name: FormAI iOS (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "app.formaistudio.formai"
        APP_STORE_APPLE_ID: 6782088017 # replace with your numeric App Store Connect app id
      node: 22.11.0
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $CM_CACHE_DIR/codemagic-signing
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install -g bun
          bun install
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            bunx cap add ios
          fi
      - name: Sync Capacitor iOS
        script: |
          bunx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          CERTIFICATE_KEY_DIR="${CM_CACHE_DIR:-$HOME/.codemagic-cache}/codemagic-signing"
          CERTIFICATE_KEY_PATH="$CERTIFICATE_KEY_DIR/codemagic_private_key"
          mkdir -p "$CERTIFICATE_KEY_DIR"
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            printf "%s\n" "$CERTIFICATE_PRIVATE_KEY" > "$CERTIFICATE_KEY_PATH"
          elif [ ! -f "$CERTIFICATE_KEY_PATH" ]; then
            ssh-keygen -t rsa -b 2048 -m PEM -f "$CERTIFICATE_KEY_PATH" -q -N ""
          fi
          chmod 600 "$CERTIFICATE_KEY_PATH"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$CERTIFICATE_KEY_PATH" \
            --create \
            --delete-stale-profiles
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
