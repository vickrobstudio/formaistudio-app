workflows:
  ios-capacitor-workflow:
    name: FormAI iOS (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      groups:
        - PRIVATE
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "app.formaistudio.formai"
        APP_STORE_APPLE_ID: 6782088017 # replace with your numeric App Store Connect app id
      node: 22.11.0
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.codemagic-signing
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install -g bun
          bun install
      - name: Add iOS platform if missing
        script: |
          set -e
          if [ ! -f "ios/App/Podfile" ]; then
            rm -rf ios
            mkdir -p dist
            npx --yes cap add ios
          fi
          ls -la ios/App
      - name: Sync Capacitor iOS
        script: |
          set -e
          mkdir -p dist
          npx --yes cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          set -e
          ls -la ios/App
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install --repo-update
          else
            echo "No Podfile found; Capacitor generated a Swift Package Manager iOS project, so CocoaPods install is skipped."
          fi
      - name: Set build number
        script: |
          set -euo pipefail
          cd ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            LATEST=0
          fi
          NEXT=$((LATEST + 1))
          if [[ "${CM_BUILD_NUMBER:-0}" =~ ^[0-9]+$ ]] && [ "${CM_BUILD_NUMBER:-0}" -gt "$NEXT" ]; then
            NEXT="$CM_BUILD_NUMBER"
          fi
          echo "Setting build number to $NEXT"
          agvtool new-version -all "$NEXT" || true
          if [ -f "App.xcodeproj/project.pbxproj" ]; then
            perl -0pi -e "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $NEXT;/g" App.xcodeproj/project.pbxproj
          fi
          if [ -f "App/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" App/Info.plist || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEXT" App/Info.plist
          fi
      - name: Fetch signing files
        script: |
          set -euo pipefail
          export SIGNING_DIR="$HOME/.codemagic-signing"
          export CERT_KEY_PATH="$SIGNING_DIR/distribution_private_key.pem"
          mkdir -p "$SIGNING_DIR"

          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          key = os.environ.get("APP_STORE_CERTIFICATE_PRIVATE_KEY") or os.environ.get("CERTIFICATE_PRIVATE_KEY") or ""
          path = Path(os.environ["CERT_KEY_PATH"])
          if key:
              normalized = key.replace("\\n", "\n").strip()
              if "PRIVATE KEY-----" in normalized:
                  path.write_text(normalized + "\n")
              else:
                  # Treat as base64: strip whitespace and pad to multiple of 4
                  compact = re.sub(r"\s+", "", normalized)
                  compact += "=" * (-len(compact) % 4)
                  try:
                      decoded = base64.b64decode(compact, validate=True)
                  except Exception as e:
                      raise SystemExit(
                          "APP_STORE_CERTIFICATE_PRIVATE_KEY is neither a PEM "
                          "(missing '-----BEGIN/END PRIVATE KEY-----' markers) "
                          "nor valid base64. Re-export the key with: "
                          "`openssl pkcs12 -in cert.p12 -nocerts -nodes -out key.pem` "
                          "and paste the FULL file contents (including BEGIN/END lines) "
                          f"into the Codemagic secret. Decode error: {e}"
                      )
                  path.write_bytes(decoded)
          PY

          if [ ! -s "$CERT_KEY_PATH" ]; then
            echo "Missing APP_STORE_CERTIFICATE_PRIVATE_KEY. Add the private key that matches an existing Apple Distribution certificate, then rerun the build."
            exit 1
          fi
          chmod 600 "$CERT_KEY_PATH"

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$CERT_KEY_PATH"
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          if [ -d "$XCODE_WORKSPACE" ]; then
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME"
          else
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
