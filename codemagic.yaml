workflows:
  ios-capacitor-workflow:
    name: FormAI iOS (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "app.formaistudio.formai"
        APP_STORE_APPLE_ID: 6782088017 # replace with your numeric App Store Connect app id
      node: 22.11.0
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.codemagic-signing
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install -g bun
          bun install
      - name: Add iOS platform if missing
        script: |
          set -e
          if [ ! -f "ios/App/Podfile" ]; then
            rm -rf ios
            mkdir -p dist
            npx --yes cap add ios
          fi
          ls -la ios/App
      - name: Sync Capacitor iOS
        script: |
          set -e
          mkdir -p dist
          npx --yes cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          set -e
          ls -la ios/App
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install --repo-update
          else
            echo "No Podfile found; Capacitor generated a Swift Package Manager iOS project, so CocoaPods install is skipped."
          fi
      - name: Set build number
        script: |
          set -euo pipefail
          cd ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            LATEST=0
          fi
          NEXT=$((LATEST + 1))
          if [[ "${CM_BUILD_NUMBER:-0}" =~ ^[0-9]+$ ]] && [ "${CM_BUILD_NUMBER:-0}" -gt "$NEXT" ]; then
            NEXT="$CM_BUILD_NUMBER"
          fi
          echo "Setting build number to $NEXT"
          agvtool new-version -all "$NEXT" || true
          if [ -f "App.xcodeproj/project.pbxproj" ]; then
            perl -0pi -e "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $NEXT;/g" App.xcodeproj/project.pbxproj
          fi
          if [ -f "App/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" App/Info.plist || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEXT" App/Info.plist
          fi
      - name: Fetch signing files
        script: |
          set -euo pipefail
          # Codemagic auto-generates a distribution certificate and provisioning
          # profile via the App Store Connect API integration. No Mac required.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          if [ -d "$XCODE_WORKSPACE" ]; then
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME"
          else
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
